{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBON — Войти</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent:        hsl(214, 69%, 50%);
      --accent-hover:  hsl(214, 69%, 40%);
      --bg:            #0a0a0a;
      --bg-card:       #141414;
      --bg-input:      #1e1e1e;
      --border:        rgba(255,255,255,0.08);
      --border-focus:  hsla(184, 73%, 42%, 0.50);
      --text-primary:  #ffffff;
      --text-secondary:#a0a0a0;
      --text-muted:    #555;
      --error:         #e05555;
      --error-bg:      rgba(224,85,85,0.1);
      --transition:    0.2s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background ────────────────── */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(184, 73%, 42%, 0.07) 0%, transparent 70%);
      top: -200px;
      left: -200px;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29,185,84,0.05) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(60px, 40px); }
    }

    /* ── Page layout ────────────────────────── */
    .auth-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 0;
    }

    /* ── Logo ───────────────────────────────── */
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      text-decoration: none;
      animation: fadeDown 0.4s ease both;
    }

    .logo-mark {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-wordmark {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-primary);
    }

    /* ── Card ───────────────────────────────── */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 36px 36px 32px;
      animation: fadeUp 0.4s ease 0.06s both;
    }

    .auth-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .auth-card-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ── Error banner ───────────────────────── */
    .error-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid rgba(224,85,85,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 22px;
      font-size: 13px;
      color: #f08080;
      animation: shake 0.35s ease both;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-3px); }
      80%      { transform: translateX(3px); }
    }

    /* ── Field group ────────────────────────── */
    .field-group { margin-bottom: 18px; }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field-label a {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    .field-label a:hover { opacity: 0.8; }

    /* Input wrapper (for eye toggle) */
    .input-wrap {
      position: relative;
    }

    .field-input {
      width: 100%;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 13px 16px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
    }

    .field-input::placeholder { color: var(--text-muted); }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29,185,84,0.12);
    }

    .field-input.has-toggle { padding-right: 46px; }

    /* Show/hide password toggle */
    .toggle-pw {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color var(--transition);
    }

    .toggle-pw:hover { color: var(--text-secondary); }

    /* ── Submit button ──────────────────────── */
    .btn-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background var(--transition), transform 0.1s, box-shadow var(--transition);
      letter-spacing: 0.01em;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 24px rgba(29,185,84,0.3);
    }

    .btn-submit:active { transform: scale(0.98); }

    /* ── Divider ────────────────────────────── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer link ────────────────────────── */
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
      animation: fadeUp 0.4s ease 0.12s both;
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: opacity var(--transition);
    }

    .auth-footer a:hover { opacity: 0.8; }

    /* ── Animations ─────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <div class="auth-page">

    <!-- Logo -->
    <a href="{% url 'index' %}" class="auth-logo">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="4" fill="#000"/>
          <circle cx="10" cy="10" r="8" stroke="#000" stroke-width="2.2" fill="none"/>
        </svg>
      </div>
      <span class="logo-wordmark">OBON</span>
    </a>

    <!-- Card -->
    <div class="auth-card">

      <div class="auth-card-title">С возвращением</div>
      <div class="auth-card-sub">Войдите, чтобы продолжить слушать</div>

      <!-- Error -->
      {% if error %}
      <div class="error-banner" role="alert">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" flex-shrink="0">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3.5a.75.75 0 01-1.5 0V5zm.75 7a1 1 0 110-2 1 1 0 010 2z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="{% url 'login' %}{% if next %}?next={{ next }}{% endif %}" novalidate>
        {% csrf_token %}
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <!-- Username -->
        <div class="field-group">
          <label class="field-label" for="id_username">Имя пользователя</label>
          <div class="input-wrap">
            <input
              class="field-input"
              type="text"
              id="id_username"
              name="username"
              value="{{ request.POST.username|default:'' }}"
              placeholder="Введите логин"
              autocomplete="username"
              autofocus
              spellcheck="false"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="id_password">
            Пароль
          </label>
          <div class="input-wrap">
            <input
              class="field-input has-toggle"
              type="password"
              id="id_password"
              name="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
            >
            <button
              type="button"
              class="toggle-pw"
              onclick="togglePassword('id_password', this)"
              aria-label="Показать пароль"
            >
              <!-- Eye icon -->
              <svg id="eye-login" width="18" height="18" viewBox="0 0 18 18" fill="none"
                   stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/>
                <circle cx="9" cy="9" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Войти</button>

      </form>

      <div class="auth-divider">или</div>

      <a href="{% url 'register' %}" style="display:block; text-align:center; padding: 13px; border-radius: 30px; border: 1.5px solid rgba(255,255,255,0.1); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; text-decoration: none; transition: border-color 0.2s, background 0.2s;"
         onmouseover="this.style.borderColor='rgba(255,255,255,0.3)'; this.style.background='rgba(255,255,255,0.04)'"
         onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='transparent'">
        Создать аккаунт
      </a>

    </div><!-- /auth-card -->

    <div class="auth-footer">
      Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a>
    </div>

  </div><!-- /auth-page -->

  <script>
    function togglePassword(inputId, btn) {
      var input = document.getElementById(inputId);
      var isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      /* Swap icon: eye ↔ eye-off */
      btn.innerHTML = isPassword
        ? /* eye-off */
          '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
            '<path d="M1 1l16 16M7.4 7.5A2.5 2.5 0 0110.6 10.6"/>' +
            '<path d="M5.2 5.3C3 6.7 1 9 1 9s3 6 8 6c1.7 0 3.2-.6 4.5-1.4"/>' +
            '<path d="M12.7 12.6C14.9 11.2 17 9 17 9S14 3 9 3c-1.1 0-2.1.2-3 .6"/>' +
          '</svg>'
        : /* eye */
          '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
            '<path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/>' +
            '<circle cx="9" cy="9" r="2.5"/>' +
          '</svg>';

      btn.setAttribute('aria-label', isPassword ? 'Скрыть пароль' : 'Показать пароль');
    }
  </script>

</body>
</html>
